server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript image/svg+xml;

  # Security headers (kept at server scope; child locations below avoid add_header
  # so they inherit these — add_header does not merge across levels in nginx).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'; upgrade-insecure-requests" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # TLS terminates at the Traefik/Coolify proxy; Cloudflare proxy is off, so HSTS must come from here.
  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /health {
    default_type text/plain;
    return 200 "ok";
  }

  # index.html must not be cached so redeploys are picked up immediately.
  location = /index.html { expires -1; }

  # Hashed/static assets — long cache (uses `expires`, not add_header, so headers inherit).
  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|css|js|woff2?)$ { expires 7d; }

  location / { try_files $uri $uri/ /index.html; }
}
